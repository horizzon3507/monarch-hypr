general {
  lock_cmd = monarch-system-lock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
  inhibit_sleep = 3
}

listener {
  timeout = 150
  on-timeout = monarch-launch-screensaver
  on-resume = pkill -f org.monarch.screensaver
}

listener {
  timeout = 151
  on-timeout = loginctl lock-session
}

listener {
  timeout = 330
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on && monarch-brightness-keyboard restore
}
