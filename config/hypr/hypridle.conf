general {
  lock_cmd = monarch-system-lock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
  inhibit_sleep = 3
}

listener {
  timeout = 150
  on-timeout = monarch-launch-screensaver
  on-resume = pkill -f '[o]rg.monarch.screensaver'
}

listener {
  timeout = 151
  on-timeout = loginctl lock-session
}

listener {
  timeout = 330
  on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"
  on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })" && monarch-brightness-keyboard restore
}
