name: Probe full Monarch config in Hyprland
on:
  push:
    branches: [probe/full-hypr]
jobs:
  full:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - run: pacman -Syu --noconfirm --needed hyprland quickshell hyprpaper hypridle hyprlock mako swayosd uwsm mesa grim seatd gcc pkgconf wayland wayland-protocols wlr-protocols git sudo qt6-wayland ttf-dejavu noto-fonts python python-pillow jq wayland-utils
      - uses: actions/checkout@v4
      - name: Build the virtual pointer helper
        run: |
          X=/usr/share/wlr-protocols/unstable/wlr-virtual-pointer-unstable-v1.xml
          cd probe-hypr
          wayland-scanner client-header "$X" wlr-virtual-pointer-unstable-v1-client-protocol.h
          wayland-scanner private-code "$X" wlr-virtual-pointer-unstable-v1-protocol.c
          gcc -o /tmp/vptr vptr.c wlr-virtual-pointer-unstable-v1-protocol.c $(pkg-config --cflags --libs wayland-client)
          chmod 755 /tmp/vptr
      - name: Run Monarch config in Hyprland
        run: |
          useradd -m tester; chmod 666 /dev/dri/* || true; (seatd -g tester &); sleep 1
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R tester: "$GITHUB_WORKSPACE"
          sudo -u tester bash "$GITHUB_WORKSPACE/probe-hypr/test-full-hypr.sh" "$GITHUB_WORKSPACE/out" || true
          cat "$GITHUB_WORKSPACE/out/results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-hypr-out
          path: out
