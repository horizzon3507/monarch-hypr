name: VM Keynav Validation

on:
  push:
    branches: [probe/vm-gpu-feasibility]

jobs:
  vm-keynav:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    timeout-minutes: 120
    env:
      PR122_SHA: 1b9ce22880016acba58c5110fbc0a0744f44b13c
      ISO_SOURCE_SHA: 99e0f22
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Download the RC ISO artifact (run 46083322004)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: monarch-iso
          path: iso/
          run-id: 46083322004
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the ISO and run the keynav validation in the VM
        run: |
          chmod +x iso/test/ci/vm-keynav-check.sh
          bash iso/test/ci/vm-keynav-check.sh \
            "$(ls iso/monarch-*.iso | head -1)" \
            "$PR122_SHA" \
            iso/out
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vm-keynav-out
          path: iso/out/
          if-no-files-found: warn
