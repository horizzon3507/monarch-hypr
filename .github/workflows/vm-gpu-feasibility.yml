name: VM GPU feasibility (probe)

# Probe branch only. One question: can a QEMU guest on a GitHub-hosted
# runner get a real DRM render node through virtio-gpu + virgl with
# software (llvmpipe) host rendering? First attempt failed: qemu's
# egl-headless insists on a host DRM render node ("egl: no drm render node
# available"). Next variants: GL through Xvfb (gtk/sdl displays with gl=on,
# llvmpipe GLX) and a vgem dummy render node if the module loads.

on:
  workflow_dispatch:
  push:
    branches: [probe/vm-gpu-feasibility]

permissions:
  contents: read

jobs:
  virgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install QEMU with virgl and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-gui qemu-utils libvirglrenderer1 libegl1 libgl1 mesa-utils xvfb curl xorriso >/dev/null
          qemu-system-x86_64 -display help 2>&1 || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm || true
          [[ -w /dev/kvm ]] || sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
          sudo modprobe vgem && ls -l /dev/dri/ || echo "no vgem"

      - name: Download a small guest (Alpine virt ISO)
        run: |
          idx=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/)
          iso=$(printf '%s' "$idx" | grep -o 'alpine-virt-[0-9.]*-x86_64\.iso' | sort -V | tail -1)
          echo "guest iso: $iso"
          curl -fsSL -o guest.iso "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/$iso"

      - name: Extract guest kernel for explicit serial console
        run: |
          mkdir x && xorriso -osirrox on -indev guest.iso -extract /boot x/boot >/dev/null 2>&1
          ls x/boot

      - name: Variant A - GL over Xvfb (gtk display)
        run: |
          set -x
          Xvfb :99 -screen 0 1024x768x24 &
          xvfb_pid=$!
          sleep 2
          DISPLAY=:99 glxinfo -B 2>&1 | head -8 || true
          accel=kvm; [[ -w /dev/kvm ]] || accel=tcg
          DISPLAY=:99 qemu-system-x86_64 \
            -machine q35,accel=$accel -cpu max -smp 2 -m 1024 \
            -kernel x/boot/vmlinuz-virt -initrd x/boot/initramfs-virt \
            -append "console=ttyS0,115200 modules=loop,squashfs,sd-mod,usb-storage,cdrom" \
            -cdrom guest.iso \
            -device virtio-vga-gl -display gtk,gl=on \
            -serial file:serialA.log -pidfile qemuA.pid -daemonize \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 || echo "QEMU-START-FAILED variantA"
          sleep 75
          [[ -f qemuA.pid ]] && kill "$(cat qemuA.pid)" 2>/dev/null || true
          kill $xvfb_pid 2>/dev/null || true
          wc -c serialA.log 2>/dev/null || true

      - name: Variant B - egl-headless with vgem render node
        if: always()
        run: |
          set -x
          rn=$(ls /dev/dri/renderD* 2>/dev/null | head -1)
          echo "render node: ${rn:-none}"
          [[ -n $rn ]] || { echo "SKIP: no host render node"; exit 0; }
          accel=kvm; [[ -w /dev/kvm ]] || accel=tcg
          qemu-system-x86_64 \
            -machine q35,accel=$accel -cpu max -smp 2 -m 1024 \
            -kernel x/boot/vmlinuz-virt -initrd x/boot/initramfs-virt \
            -append "console=ttyS0,115200 modules=loop,squashfs,sd-mod,usb-storage,cdrom" \
            -cdrom guest.iso \
            -device virtio-vga-gl -display "egl-headless,rendernode=$rn" \
            -serial file:serialB.log -pidfile qemuB.pid -daemonize \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 || echo "QEMU-START-FAILED variantB"
          sleep 75
          [[ -f qemuB.pid ]] && kill "$(cat qemuB.pid)" 2>/dev/null || true
          wc -c serialB.log 2>/dev/null || true

      - name: Verdict
        if: always()
        run: |
          for log in serialA.log serialB.log; do
            echo "=== $log ==="
            [[ -s $log ]] || { echo "(empty)"; continue; }
            if grep -qiE 'virtio_gpu|\[drm\]' "$log"; then
              grep -iE 'virtio_gpu|\[drm\]|renderD|virgl' "$log" | head -15
              echo "VERDICT: $log - guest kernel bound the virtio GPU driver"
            else
              echo "VERDICT: $log - booted but no virtio GPU driver evidence:"
              tail -20 "$log"
            fi
          done
