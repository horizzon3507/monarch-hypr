name: Build ISO

# Manual only. No schedule, no push trigger: a build downloads several GB.
# Builds the ISO from this checkout (desktop at the root, recipe in pkgs/, builder in iso/).
on:
  workflow_dispatch:
    inputs:
      boot_test:
        description: Boot the built ISO in QEMU and capture screenshots
        type: boolean
        default: true
      inspect_present:
        description: Package names that must be in the target image record (space separated). Empty = report only.
        default: ''
      inspect_present_live:
        description: Package names that must be in the live root (space separated). Empty = report only.
        default: ''
      inspect_absent:
        description: Package families that must appear nowhere in the ISO (space separated, e.g. "niri noctalia"). Empty = report only.
        default: ''
      inspect_absent_installed:
        description: Package families that must be absent from the installed image side but may stay in the live session (space separated, e.g. "nmap hashcat"). Empty = report only.
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      iso_name: ${{ steps.collect.outputs.iso_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resources before cleanup
        run: |
          nproc; free -g; df -h /
          docker version --format '{{.Server.Version}}'
          ls -l /dev/kvm || true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Build ISO in the CachyOS container
        working-directory: iso
        run: |
          date -u
          ./bin/monarch-iso-make --no-boot-offer --keep-pkg-cache --local-source .. ../pkgs
          date -u
          df -h /

      - name: Collect ISO and checksum
        id: collect
        working-directory: iso
        run: |
          iso=$(ls release/*.iso | head -n1)
          ls -lh release
          sha256sum "$iso" | tee "$iso.sha256"
          echo "iso_name=$(basename "$iso")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: monarch-iso
          path: |
            iso/release/*.iso
            iso/release/*.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  inspect:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monarch-iso
          path: release
      - name: Inspect ISO contents (kernel, desktop packages, installer lists)
        env:
          INSPECT_EXPECT_PRESENT: ${{ inputs.inspect_present }}
          INSPECT_EXPECT_PRESENT_LIVE: ${{ inputs.inspect_present_live }}
          INSPECT_EXPECT_ABSENT: ${{ inputs.inspect_absent }}
          INSPECT_EXPECT_ABSENT_INSTALLED: ${{ inputs.inspect_absent_installed }}
        run: |
          iso=$(ls release/*.iso | head -n1)
          bash iso/test/ci/inspect-iso.sh "$iso" iso-inspection
      - name: Summary
        if: always()
        run: |
          { echo '### ISO inspection'; echo '```'; cat iso-inspection/report.txt 2>/dev/null || echo 'no report'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-inspection
          path: |
            iso-inspection/*.txt
          retention-days: 14

  boot-test:
    needs: build
    if: ${{ inputs.boot_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monarch-iso
          path: release
      - name: Boot in QEMU (UEFI)
        run: |
          iso=$(ls release/*.iso | head -n1)
          bash iso/test/ci/qemu-boot-check.sh "$iso" uefi out-uefi
      - name: Boot in QEMU (BIOS)
        if: always()
        run: |
          iso=$(ls release/*.iso | head -n1)
          bash iso/test/ci/qemu-boot-check.sh "$iso" bios out-bios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-evidence
          path: |
            out-uefi
            out-bios
          retention-days: 14
