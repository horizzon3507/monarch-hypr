name: Build ISO

# Manual only. No schedule, no push trigger: a build downloads several GB.
on:
  workflow_dispatch:
    inputs:
      installer_repo:
        description: Git URL of the Monarch installer repo baked into the ISO
        default: https://github.com/monarch-os/monarch.git
      installer_ref:
        description: Branch or tag of the installer repo
        default: dev
      pkgs_repo:
        description: Git URL of the monarch-pkgs repo
        default: https://github.com/monarch-os/monarch-pkgs.git
      pkgs_ref:
        description: Branch or tag of monarch-pkgs
        default: main
      boot_test:
        description: Boot the built ISO in QEMU and capture screenshots
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      iso_name: ${{ steps.collect.outputs.iso_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resources before cleanup
        run: |
          nproc; free -g; df -h /
          docker version --format '{{.Server.Version}}'
          ls -l /dev/kvm || true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Build ISO in the CachyOS container
        env:
          MONARCH_INSTALLER_REPO: ${{ inputs.installer_repo }}
          MONARCH_INSTALLER_REF: ${{ inputs.installer_ref }}
          MONARCH_PKGS_REPO: ${{ inputs.pkgs_repo }}
          MONARCH_PKGS_REF: ${{ inputs.pkgs_ref }}
        run: |
          date -u
          ./bin/monarch-iso-make --no-boot-offer --keep-pkg-cache
          date -u
          df -h /

      - name: Collect ISO and checksum
        id: collect
        run: |
          iso=$(ls release/*.iso | head -n1)
          ls -lh release
          sha256sum "$iso" | tee "$iso.sha256"
          echo "iso_name=$(basename "$iso")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: monarch-iso
          path: |
            release/*.iso
            release/*.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  boot-test:
    needs: build
    if: ${{ inputs.boot_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monarch-iso
          path: release
      - name: Boot in QEMU (UEFI)
        run: |
          iso=$(ls release/*.iso | head -n1)
          bash test/ci/qemu-boot-check.sh "$iso" uefi out-uefi
      - name: Boot in QEMU (BIOS)
        if: always()
        run: |
          iso=$(ls release/*.iso | head -n1)
          bash test/ci/qemu-boot-check.sh "$iso" bios out-bios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-evidence
          path: |
            out-uefi
            out-bios
          retention-days: 14
