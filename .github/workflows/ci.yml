name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - 'assets/demo.gif'
      - 'assets/demo.png'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - 'assets/demo.gif'
      - 'assets/demo.png'
  workflow_dispatch:
    inputs:
      month:
        description: 'Monthly milestone (YYYY.MM, for example 2026.11)'
        required: true
        type: string
      notes:
        description: 'Reviewed monthly patch notes (Markdown)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils python3-gi gir1.2-glib-2.0 gir1.2-gtk-3.0 libgtk-3-bin hicolor-icon-theme imagemagick xmlstarlet fontconfig lua5.4 ripgrep zsh

      - name: Install mise for runtime tests
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.3"
          install: false
          cache: false

      - name: Run deterministic integration suite
        run: test/run integration

  iso-pkgs-static-tests:
    name: ISO and package static tests
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install test dependencies
        run: pacman -Syu --noconfirm --needed bash git python libarchive pacman-contrib base-devel shellcheck parted util-linux jq

      - uses: actions/checkout@v4

      - name: Run iso/ shell unit tests
        run: |
          git config --global --add safe.directory "$PWD"
          cd iso
          status=0
          for t in test/unit/*-test.sh; do
            echo "== $t"
            bash "$t" || { echo "::error::FAILED $t"; status=1; }
          done
          exit $status

      - name: Run iso/ Python unit tests
        run: cd iso && python -m unittest discover -s test/unit -p 'test_*.py'

      - name: Run package recipe tests
        run: |
          cd pkgs/pkgbuilds/monarch
          for t in permissions-test.sh defaults-permissions-test.sh; do bash "$t" "$GITHUB_WORKSPACE"; done

  monarch-package-build:
    name: Monarch package build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git python sudo

      - uses: actions/checkout@v4

      - name: Build the monarch package with makepkg
        # Same flags as iso/builder/build-monarch-package.sh. --nodeps only skips
        # installing runtime dependencies; package() must still find every file it ships.
        run: |
          git config --global --add safe.directory "$PWD"
          useradd -m builder
          src=/tmp/monarch-src work=/tmp/monarch-pkg
          mkdir -p "$src" "$work"
          tar --exclude=./iso --exclude=./pkgs --exclude=./.git -cf - . | tar -C "$src" -xf -
          printf '%s\n' 0.0.ci >"$src/version"
          cp -a pkgs/pkgbuilds/monarch/. "$work/"
          chown -R builder:builder "$work" "$src"
          su builder -c "cd '$work' && PKGDEST='$work' MONARCH_SRC='$src' MONARCH_LOCAL_PKGVER=0.0.ci MONARCH_LOCAL_REVISION='$(git rev-parse HEAD)' makepkg --noconfirm --skippgpcheck --skipchecksums --nodeps -f"
          ls -l "$work"/*.pkg.tar.*
          bsdtar -tf "$work"/monarch-0*.pkg.tar.* | grep -c . 

  repository-tests:
    name: Repository availability tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Pacman and PyPI package availability
        run: test/run focused test/monarch-packages-exist-test.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint bin/ scripts
        # zsh scripts are skipped: shellcheck only supports sh/bash/dash/ksh.
        run: |
          grep -rlE '^#!/(usr/)?bin/(env +)?(ba)?sh\b' bin/ \
            | xargs shellcheck --severity=error

      - name: Lint install scripts and migrations
        # Sourced scripts: no shebang, so the shell must be forced.
        run: |
          find install migrations -name '*.sh' \
            | xargs shellcheck --shell=bash --severity=error

      - name: Lint test entry points
        run: shellcheck --severity=error test/run test/acceptance test/acceptance.d/*.sh

  version:
    name: Tag tested dev revision
    needs: [integration-tests, repository-tests, shellcheck]
    if: github.repository == 'monarch-os/monarch' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: monarch-calver
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Allocate version and publish monthly notes when requested
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MONTH: ${{ inputs.month }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 .github/scripts/calver.py
