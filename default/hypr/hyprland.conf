# Monarch entry-point Hyprland configuration.
#
# monarch-refresh-hypr installs this file at ~/.config/hypr/hyprland.conf and
# replaces @MONARCH_PATH@ with the runtime root. Do not edit the installed copy.
# Customise Monarch in the user-owned files in ~/.config/hypr/ (sourced last,
# so they win): monitors.conf, input.conf, bindings.conf, looknfeel.conf,
# autostart.conf. See https://wiki.hypr.land/Configuring/

source = @MONARCH_PATH@/default/hypr/envs.conf
source = @MONARCH_PATH@/default/hypr/input.conf
source = @MONARCH_PATH@/default/hypr/autostart.conf

# Shell layer (bar, launcher, notifications, lock, wallpaper, OSD): owns the
# monarch-shell-start autostart and its key bindings and layer rules.
source = @MONARCH_PATH@/default/hypr/shell.conf

# Console keyboard layout, generated by install/user/detect-keyboard-layout.sh
source = ~/.config/hypr/keyboard.conf

# User overrides
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf
