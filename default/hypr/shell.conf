# Desktop shell: startup, shell keybinds and layer rules. Owned by the shell
# layer (Waybar, Walker, Mako, Hyprlock, Hypridle, Hyprpaper, SwayOSD).
exec-once = monarch-shell-start

# Menus and launcher
bindd = SUPER, SPACE, Launcher, exec, walker
bindd = SUPER ALT, SPACE, Monarch menu, exec, monarch-menu
bindd = SUPER CTRL, SPACE, Background picker, exec, monarch-menu style.background
bindd = SUPER SHIFT CTRL, SPACE, Style menu, exec, monarch-menu style
bindd = SUPER CTRL, E, Emoji picker, exec, walker -m symbols
bindd = SUPER CTRL, C, Capture menu, exec, monarch-menu trigger.capture
bindd = SUPER CTRL, O, Toggle menu, exec, monarch-menu trigger.toggle
bindd = SUPER CTRL, H, Hardware menu, exec, monarch-menu trigger.hardware
bindd = SUPER CTRL, S, Share, exec, monarch-menu trigger.share
bindd = SUPER CTRL, R, Set reminder, exec, monarch-menu trigger.reminder.set
bindd = SUPER, K, Show key bindings, exec, monarch-menu-keybindings
bindd = SUPER SHIFT, V, Clipboard manager, exec, walker -m clipboard
bindd = SUPER, COMMA, Control center, exec, monarch-menu trigger.toggle
bindd = , XF86PowerOff, Power menu, exec, monarch-menu system
bindd = SUPER SHIFT, L, Power menu, exec, monarch-menu system

# Session
bindld = SUPER, L, Lock screen, exec, monarch-system-lock

# Toggles
bindd = SUPER CTRL, COMMA, Toggle Do Not Disturb, exec, monarch-toggle-notification-silencing
bindd = SUPER CTRL, I, Toggle idle lock, exec, monarch-toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, monarch-toggle-nightlight

# Volume and brightness
bindeld = , XF86AudioRaiseVolume, Volume up, exec, monarch-osd volume up
bindeld = , XF86AudioLowerVolume, Volume down, exec, monarch-osd volume down
bindeld = , XF86AudioMute, Mute, exec, monarch-osd volume mute
bindeld = , XF86MonBrightnessUp, Brightness up, exec, monarch-osd brightness up
bindeld = , XF86MonBrightnessDown, Brightness down, exec, monarch-osd brightness down
bindld = SHIFT, XF86MonBrightnessUp, Brightness max, exec, monarch-osd brightness max
bindld = SHIFT, XF86MonBrightnessDown, Brightness min, exec, monarch-osd brightness min
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, swayosd-client --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, swayosd-client --output-volume -1
bindld = , XF86AudioMicMute, Mic mute, exec, monarch-audio-input-mute

# Layer rules
layerrule = noanim, walker
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = noanim, selection
